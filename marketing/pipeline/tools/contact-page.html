<!doctype html>
<html data-theme="arcanum">
<head>
<meta charset="utf-8">
<title>Contact sheet</title>
<!-- PRIVATE. Page used by tools/contact-sheet.mjs to lay out review frames
     decoded from a rendered MP4. Not a video. -->
<link rel="stylesheet" href="/site/fonts.css">
<style>
  html,body{margin:0;background:#05080d;color:#c7d5e2}
  body{display:inline-block;padding:24px;font:500 18px/1.4 "Geist Mono", ui-monospace, monospace}
  h1{margin:0 0 6px;font:600 22px/1.3 "Geist Mono", ui-monospace, monospace;color:#e6b450;letter-spacing:.02em}
  .sub{margin:0 0 18px;color:#9db2c6;font-size:15px}
  .sheet{display:grid;gap:14px 12px}
  figure{margin:0}
  img{display:block;outline:1px solid #27496b}
  figcaption{margin-top:6px;font-size:14px;color:#c7d5e2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  figcaption b{color:#e6b450;font-weight:600}
</style>
</head>
<body>
<h1 id="title"></h1><p class="sub" id="sub"></p>
<div class="sheet" id="sheet"></div>
<script>
window.build = async ({ title, sub, cols, tileW, tiles }) => {
  document.getElementById('title').textContent = title;
  document.getElementById('sub').textContent = sub;
  const g = document.getElementById('sheet');
  g.style.gridTemplateColumns = `repeat(${cols}, ${tileW}px)`;
  for (const t of tiles) {
    const f = document.createElement('figure');
    const img = new Image(); img.src = t.src; img.width = tileW;
    const c = document.createElement('figcaption');
    const b = document.createElement('b'); b.textContent = t.head; c.append(b, ' ' + t.label);
    f.append(img, c); g.append(f);
    await img.decode();
  }
  await document.fonts.load('500 14px "Geist Mono"', 'f0 0.00 s');
  await document.fonts.ready;
  const r = document.body.getBoundingClientRect();
  return { w: Math.ceil(r.width), h: Math.ceil(r.height) };
};
</script>
</body>
</html>
