<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Yasser — au travail</title>
<style>
  html, body { margin: 0; background: transparent; }
  .stage { position: relative; width: 1080px; height: 1080px; overflow: hidden; }
  /* the bust is 854x830 drawn at native size (79% of the frame width, 77% of its height) */
  .bust { position: absolute; left: 113px; top: 125px; width: 854px; height: 830px; transform-origin: 62% 100%; will-change: transform; }
  .squash { position: absolute; left: 0; top: 0; width: 854px; height: 830px; transform-origin: 50% 100%; will-change: transform; }
  .squash img { display: block; width: 854px; height: 830px; }
  svg.fx { position: absolute; left: 0; top: 0; overflow: visible; }
</style>
</head>
<body>
<div class="stage">
  <div class="bust" id="bust">
    <div class="squash" id="squash">
      <img src="../assets/y-typing.png" width="854" height="830" alt="">
      <!-- effects drawn in the asset's own pixel space so they ride the bob with the keyboard -->
      <svg class="fx" width="854" height="830" viewBox="0 0 854 830">
        <g id="ticks" fill="none" stroke-linecap="round"></g>
        <g id="sparks" stroke="#1b1712" stroke-width="6.5" stroke-linejoin="round"></g>
      </svg>
    </div>
  </div>
</div>
<script src="../runtime.js"></script>
<script>
  const { ease, win, set } = Motion;
  const NS = 'http://www.w3.org/2000/svg';
  const INK = '#1b1712', BONE = '#efe6d6', WINE = '#7a2430';
  const bust = document.getElementById('bust'), squash = document.getElementById('squash');

  // ---- the bob: four per loop, accented strong-weak so the rhythm reads as typing, not a metronome
  const ACCENT = [1, 0.55, 0.85, 0.45];
  function bob(p) {
    const b = Math.floor(p * 4) % 4, q = (p * 4) % 1, a = ACCENT[b];
    let k;
    if (q < 0.12) k = ease.out(q / 0.12);                     // the strike: down in two frames
    else if (q < 0.62) { const t = (q - 0.12) / 0.5; k = (1 - t) * (1 - t) * Math.cos(1.35 * Math.PI * t); } // up with a small rebound
    else k = 0;                                                 // rest: identical frames
    return { k: k * a, b, q };
  }

  // ---- keystroke sparks: tiny squares that pop just above the keys, drift up and snap shut
  // x, y in asset px; start phase; size; drift; spin; fill
  // the two wine sparks pop from behind the lid's top edge and rise into open air, never over
  // the coat or the strap, where a resting wine square would read as a patch or a buckle
  const SPARKS = [
    { x: 296, y: 616, at: 0.000, s: 42, dx: -40, dy: -70, r: -14, dr: -40, f: BONE },
    { x: 392, y: 650, at: 0.115, s: 32, dx: -6,  dy: -56, r: 10,  dr: 30,  f: BONE },
    { x: 187, y: 559, at: 0.250, s: 38, dx: 20,  dy: -66, r: 18,  dr: 40,  f: WINE },
    { x: 318, y: 640, at: 0.365, s: 32, dx: -50, dy: -48, r: -6,  dr: -30, f: BONE },
    { x: 282, y: 636, at: 0.500, s: 38, dx: -62, dy: -58, r: 24,  dr: 34,  f: BONE },
    { x: 123, y: 551, at: 0.615, s: 42, dx: -40, dy: -66, r: -10, dr: -34, f: WINE },
    { x: 530, y: 684, at: 0.750, s: 32, dx: 30,  dy: -52, r: 8,   dr: 36,  f: BONE },
    { x: 360, y: 646, at: 0.865, s: 36, dx: -30, dy: -62, r: 14,  dr: -28, f: BONE },
  ];
  const LIFE = 0.17; // ~10 frames
  const sparkG = document.getElementById('sparks');
  SPARKS.forEach((d) => {
    d.el = document.createElementNS(NS, 'rect');
    d.el.setAttribute('x', -d.s / 2); d.el.setAttribute('y', -d.s / 2);
    d.el.setAttribute('width', d.s); d.el.setAttribute('height', d.s);
    d.el.setAttribute('rx', 4); d.el.setAttribute('fill', d.f);
    sparkG.appendChild(d.el);
  });
  function spark(d, p) {
    const t = (((p - d.at) % 1) + 1) % 1 / LIFE;
    if (t >= 1) { d.el.setAttribute('visibility', 'hidden'); return; }
    const pop = ease.back(win(t, 0, 0.16)), shut = ease.in(win(t, 0.62, 1));
    const k = pop * (1 - shut);
    if (k < 0.02) { d.el.setAttribute('visibility', 'hidden'); return; }
    const m = ease.out(t);
    d.el.setAttribute('visibility', 'visible');
    d.el.setAttribute('transform', `translate(${(d.x + d.dx * m).toFixed(2)} ${(d.y + d.dy * m).toFixed(2)}) rotate(${(d.r + d.dr * t).toFixed(2)}) scale(${k.toFixed(4)})`);
  }

  // ---- speed ticks: a pair of short strokes flicking out from the hand that strikes
  // left hand (his right) on beats 1 and 3, right hand on beats 2 and 4
  const TICKS = [
    { beats: [0, 2], dashes: [[296, 640, 266, 614], [290, 664, 254, 656]] },
    { beats: [1, 3], dashes: [[484, 672, 502, 640], [506, 684, 540, 668]] },
  ];
  const tickG = document.getElementById('ticks');
  TICKS.forEach((tk) => {
    tk.lines = tk.dashes.map(([x1, y1, x2, y2]) => {
      const L = Math.hypot(x2 - x1, y2 - y1);
      const pair = [[INK, 17], [BONE, 7]].map(([c, w]) => {
        const l = document.createElementNS(NS, 'line');
        l.setAttribute('x1', x1); l.setAttribute('y1', y1); l.setAttribute('x2', x2); l.setAttribute('y2', y2);
        l.setAttribute('stroke', c); l.setAttribute('stroke-width', w);
        tickG.appendChild(l);
        return l;
      });
      return { L, pair };
    });
  });
  function tick(tk, b, q) {
    const on = tk.beats.includes(b);
    const t = on ? q / 0.36 : 9; // ~5 frames; off-beat: fully gone (the trailing stroke too)
    tk.lines.forEach(({ L, pair }, i) => {
      const tt = t - i * 0.08; // the second stroke trails by a hair
      const e = L * ease.out(win(tt, 0, 0.35)), s = L * ease.in(win(tt, 0.45, 1));
      const vis = e - s > 1.5;
      pair.forEach((l) => {
        l.setAttribute('visibility', vis ? 'visible' : 'hidden');
        l.setAttribute('stroke-dasharray', `${(e - s).toFixed(2)} ${(L * 3).toFixed(2)}`);
        l.setAttribute('stroke-dashoffset', (-s).toFixed(2));
      });
    });
  }

  Sticker({
    seconds: 2, fps: 30, poster: 3,
    draw(p) {
      const { k, b, q } = bob(p);
      // dip into the screen: a hair of lean toward the laptop and a squash from the desk line
      set(bust, { r: -0.8 * k });
      set(squash, { sx: 1 + 0.006 * k, sy: 1 - 0.018 * k });
      SPARKS.forEach((d) => spark(d, p));
      TICKS.forEach((tk) => tick(tk, b, q));
    },
  });
</script>
</body>
</html>
