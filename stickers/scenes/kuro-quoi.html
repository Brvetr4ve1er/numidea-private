<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Kūro — quoi</title>
<style>
  html, body { margin: 0; background: transparent; }
  .stage { position: relative; width: 1080px; height: 1080px; overflow: hidden; }
  /* soft contact shadow under the four paws (the back paws sit higher in the 3/4 view) */
  .shadow { position: absolute; left: 570px; top: 968px; width: 500px; height: 96px; margin-left: -250px; margin-top: -48px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(20, 16, 12, .30), rgba(20, 16, 12, 0)); will-change: transform; }
  /* the cat works in asset pixels (491 x 659) and is scaled by the transform;
     the pivot is the ground line between the front paws (asset 200, 645), at stage (560, 1000) */
  .fig { position: absolute; left: 360px; top: 355px; width: 491px; height: 659px; transform-origin: 200px 645px; will-change: transform; }
  .fig img { position: absolute; left: 0; top: 0; width: 491px; height: 659px; display: block; }
  svg.fx { position: absolute; left: 0; top: 0; width: 1080px; height: 1080px; overflow: visible; pointer-events: none; }
</style>
</head>
<body>
<div class="stage">
  <div class="shadow" id="shadow"></div>
  <div class="fig" id="fig"><img src="../assets/k-alarm.png" alt=""></div>
  <svg class="fx" id="fx" viewBox="0 0 1080 1080">
    <!-- the exclamation mark: a tapered burgundy bar and a dot, ink outline painted under the fill -->
    <g id="bang" opacity="0">
      <g fill="#7a2430" stroke="#1b1712" stroke-width="15" stroke-linejoin="round" paint-order="stroke">
        <path d="M-34 -94 Q-34 -114 0 -114 Q34 -114 34 -94 L15 30 Q13 40 0 40 Q-13 40 -15 30 Z"/>
        <circle cx="0" cy="84" r="25"/>
      </g>
      <path d="M-19 -92 L-14 -52" fill="none" stroke="#efe6d6" stroke-width="7" stroke-linecap="round"/>
    </g>
  </svg>
</div>
<script src="../runtime.js"></script>
<script>
  const { ease, set } = Motion;
  const F = 48;                           // frames per loop (1.6 s at 30 fps); keys below are in frames
  const K = 1.12;                         // asset px to stage px
  const O = { x: 200, y: 645 };           // ground pivot, asset px
  const S = { x: 560, y: 1000 };          // ground pivot, stage px
  const H = { x: 125, y: 115 };           // centre of the head, asset px
  const fig = document.getElementById('fig'), shadow = document.getElementById('shadow');
  const bang = document.getElementById('bang');

  // keyframes: [[frame, value, easeIntoThisKey], ...], first and last at rest
  function kf(f, keys) {
    for (let i = 1; i < keys.length; i++) {
      if (f <= keys[i][0]) {
        const [t0, v0] = keys[i - 1], [t1, v1, e = ease.inOut] = keys[i];
        return v0 + (v1 - v0) * e((f - t0) / (t1 - t0));
      }
    }
    return keys[keys.length - 1][1];
  }

  // the startle: a two-frame crouch, a snap up into a stretch (ease.back) with a little hop,
  // a landing squash, then a shake on twos that dies out; at rest from frame 28
  function pose(f) {
    const sy = kf(f, [[0, 1], [2, 0.9, ease.out], [7, 1.06, ease.back], [12, 1], [14, 0.95, ease.out], [19, 1, ease.out], [F, 1]]);
    const lift = kf(f, [[0, 0], [2, 0], [6, -28, ease.out], [12, 0, ease.in], [F, 0]]);
    const r = kf(f, [[0, 0], [12, 0], [14, 1.8], [16, -1.6], [18, 1.3], [20, -1.0], [22, 0.7], [24, -0.4], [26, 0.2], [28, 0], [F, 0]]);
    const x = kf(f, [[0, 0], [12, 0], [14, 9], [16, -8], [18, 6], [20, -5], [22, 3.5], [24, -2], [26, 1], [28, 0], [F, 0]]);
    return { sy, sx: 1 - (sy - 1) * 0.6, lift, r, x };
  }

  // where the head centre lands on the stage for a pose, so the effects ride along with it
  function head(ps) {
    const a = ps.r * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    const vx = (H.x - O.x) * K * ps.sx, vy = (H.y - O.y) * K * ps.sy;
    return { x: S.x + ps.x + vx * c - vy * s, y: S.y + ps.lift + vx * s + vy * c };
  }
  const REST = head({ sy: 1, sx: 1, lift: 0, r: 0, x: 0 });

  // three startle strokes radiating above the head, ink under bone like the hand-drawn outline;
  // they shoot out on the snap, ride the shake, then the tails chase the tips off
  const NS = 'http://www.w3.org/2000/svg';
  const fx = document.getElementById('fx');
  const strokes = [{ a: -110, r1: 178, r2: 250 }, { a: -79, r1: 180, r2: 266 }, { a: -48, r1: 178, r2: 248 }].map((d, i) => {
    const g = document.createElementNS(NS, 'g');
    const ink = document.createElementNS(NS, 'line'), bone = document.createElementNS(NS, 'line');
    for (const [el, col, w] of [[ink, '#1b1712', 27], [bone, '#efe6d6', 13]]) {
      el.setAttribute('stroke', col); el.setAttribute('stroke-width', w); el.setAttribute('stroke-linecap', 'round');
      g.appendChild(el);
    }
    fx.insertBefore(g, bang);
    return { ...d, i, g, ink, bone };
  });

  function drawStroke(st, f, hd) {
    const d = st.i * 0.6;                                         // a slight stagger, left to right
    const head = ease.out((f - 3 - d) / 4);                       // tip shoots out with the snap
    const tail = Math.min(Math.max(ease.inOut((f - 24 - d) / 5), 0), 1);   // tail chases it off
    if (head <= 0.02 || tail >= 1) { st.g.setAttribute('opacity', '0'); return; }
    const len = st.r2 - st.r1;
    const kick = 10 * ease.out((f - 3 - d) / 7) + 16 * tail;      // a small outward flick
    const r0 = st.r1 + kick + len * tail, r1 = st.r1 + kick + len * head;
    const a = st.a * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    const x0 = hd.x + r0 * c, y0 = hd.y + r0 * s, x1 = hd.x + r1 * c, y1 = hd.y + r1 * s;
    for (const el of [st.ink, st.bone]) {
      el.setAttribute('x1', x0.toFixed(1)); el.setAttribute('y1', y0.toFixed(1));
      el.setAttribute('x2', x1.toFixed(1)); el.setAttribute('y2', y1.toFixed(1));
    }
    st.g.setAttribute('opacity', (1 - tail * tail).toFixed(3));
  }

  // the "!" floats up-left of the head: pops in with an overshoot as the cat peaks,
  // squashes when he lands, wobbles against the shake, then blinks out before the loop ends
  const BANG = { dx: -235, dy: -100, r: -12 };
  function drawBang(f, ps, hd) {
    const s = kf(f, [[0, 0], [4, 0], [9, 1, ease.back], [37, 1], [39, 1.12, ease.out], [42, 0, ease.in], [F, 0]]);
    if (s <= 0.001) { bang.setAttribute('opacity', '0'); return; }
    const sy = kf(f, [[0, 1], [12, 1], [14, 0.9, ease.out], [18, 1, ease.out], [F, 1]]);
    const sx = 1 + (1 - sy) * 0.7;
    const r = BANG.r + kf(f, [[0, -26], [4, -26], [10, 0, ease.back], [F, 0]]) - 1.6 * ps.r;
    const x = REST.x + BANG.dx + 0.7 * (hd.x - REST.x), y = REST.y + BANG.dy + 0.7 * (hd.y - REST.y);
    bang.setAttribute('opacity', '1');
    bang.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(2)}) scale(${(s * sx).toFixed(4)} ${(s * sy).toFixed(4)})`);
  }

  Sticker({
    seconds: 1.6, fps: 30, poster: 23,
    draw(p) {
      const f = p * F;
      const ps = pose(f);
      set(fig, { x: ps.x, y: ps.lift, r: ps.r, s: K, sx: ps.sx, sy: ps.sy });
      const up = -ps.lift / 28;
      shadow.style.transform = `scaleX(${((1 - 0.16 * up) * ps.sx).toFixed(4)})`;
      shadow.style.opacity = (1 - 0.35 * up).toFixed(3);
      const hd = head(ps);
      strokes.forEach((st) => drawStroke(st, f, hd));
      drawBang(f, ps, hd);
    },
  });
</script>
</body>
</html>
