<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Yasser — euh</title>
<style>
  html, body { margin: 0; background: transparent; }
  .stage { position: relative; width: 1080px; height: 1080px; overflow: hidden; }
  /* the bust is 603x767 drawn at 1.08x = 651x828 (77% of the frame height); it wobbles around the base centre */
  .bust { position: absolute; left: 225px; top: 192px; width: 651px; height: 828px; transform-origin: 50% 100%; will-change: transform; }
  .squash { position: absolute; left: 0; top: 0; width: 651px; height: 828px; transform-origin: 50% 100%; will-change: transform; }
  .squash img { display: block; width: 651px; height: 828px; }
  svg.fx { position: absolute; left: 0; top: 0; overflow: visible; }
  svg.q { position: absolute; overflow: visible; transform-origin: 50% 82%; will-change: transform; }
</style>
</head>
<body>
<div class="stage">
  <div class="bust" id="bust">
    <div class="squash" id="squash">
      <img src="../assets/y-scratch.png" width="651" height="828" alt="">
      <!-- effects that ride on the head, drawn in the asset's own pixel space (603x767) -->
      <svg class="fx" width="651" height="828" viewBox="0 0 603 767">
        <!-- scratch marks off the knuckles, two poses swapped on threes -->
        <g id="scrA" fill="none" stroke-linecap="round">
          <path d="M350 118 L348 97 M371 124 L384 106 M383 143 L404 138" stroke="#1b1712" stroke-width="12"/>
          <path d="M350 118 L348 97 M371 124 L384 106 M383 143 L404 138" stroke="#efe6d6" stroke-width="5"/>
        </g>
        <g id="scrB" fill="none" stroke-linecap="round">
          <path d="M360 113 L362 90 M379 131 L396 117 M384 155 L407 157" stroke="#1b1712" stroke-width="12"/>
          <path d="M360 113 L362 90 M379 131 L396 117 M384 155 L407 157" stroke="#efe6d6" stroke-width="5"/>
        </g>
        <!-- sweat drop at the temple -->
        <g id="drop" transform="translate(122 162) scale(0)">
          <path d="M0 -27 C6 -15 18 -3 18 9 C18 21 10 28 0 28 C-10 28 -18 21 -18 9 C-18 -3 -6 -15 0 -27 Z"
                fill="#efe6d6" stroke="#1b1712" stroke-width="6" stroke-linejoin="round"/>
          <path d="M9 7 C11 13 9 18 4 21" fill="none" stroke="#1b1712" stroke-width="3.6" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
  </div>
  <!-- two question marks: ink outline, bone (left) and burgundy (right) body -->
  <svg class="q" id="q1" width="125" height="190" viewBox="-60 -120 125 190">
    <path d="M-34 -52 C-34 -82 -12 -96 6 -96 C30 -96 44 -78 44 -58 C44 -34 14 -28 8 -6 L8 12" fill="none" stroke="#1b1712" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-34 -52 C-34 -82 -12 -96 6 -96 C30 -96 44 -78 44 -58 C44 -34 14 -28 8 -6 L8 12" fill="none" stroke="#efe6d6" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="8" cy="46" r="19" fill="#1b1712"/><circle cx="8" cy="46" r="11" fill="#efe6d6"/>
  </svg>
  <svg class="q" id="q2" width="125" height="190" viewBox="-60 -120 125 190">
    <path d="M-34 -52 C-34 -82 -12 -96 6 -96 C30 -96 44 -78 44 -58 C44 -34 14 -28 8 -6 L8 12" fill="none" stroke="#1b1712" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-34 -52 C-34 -82 -12 -96 6 -96 C30 -96 44 -78 44 -58 C44 -34 14 -28 8 -6 L8 12" fill="none" stroke="#7a2430" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="8" cy="46" r="19" fill="#1b1712"/><circle cx="8" cy="46" r="11" fill="#7a2430"/>
  </svg>
</div>
<script src="../runtime.js"></script>
<script>
  const { ease, win, set } = Motion;
  const bust = document.getElementById('bust'), squash = document.getElementById('squash');
  const drop = document.getElementById('drop');
  const scrA = document.getElementById('scrA'), scrB = document.getElementById('scrB');
  // question marks: stage centre, size, resting tilt, and their window in the loop
  const qs = [
    { el: document.getElementById('q1'), x: 322, y: 158, s: 0.86, r: -14, in: 0.03, out: 0.37 },
    { el: document.getElementById('q2'), x: 742, y: 222, s: 1.0, r: 12, in: 0.53, out: 0.86 },
  ];
  qs.forEach((q) => { q.el.style.left = (q.x - 62.5) + 'px'; q.el.style.top = (q.y - 95) + 'px'; });

  // tilt: leans left (-2 deg) toward the first "?", snaps right (+2) toward the second, snaps back to close the loop
  function tilt(p) {
    const a = win(p, 0.42, 0.54), b = win(p, 0.90, 1.0);
    // a two-frame wind-up against each swing so the snap reads as a decision, not a twitch
    const wa = Math.sin(Math.PI * win(p, 0.385, 0.445)), wb = Math.sin(Math.PI * win(p, 0.865, 0.925));
    const r = -2 + 4 * ease.back(a) - 4 * ease.back(b) - 0.6 * wa + 0.6 * wb;
    // a small settle-dip from the base while the weight shifts
    const dip = Math.sin(Math.PI * a) + Math.sin(Math.PI * b);
    return { r, sy: 1 - 0.014 * dip, sx: 1 + 0.006 * dip };
  }

  // a "?" pops up with overshoot, floats a touch while held, then snaps shut
  function q(d, p) {
    const a = win(p, d.in, d.in + 0.07), h = win(p, d.in + 0.07, d.out), b = win(p, d.out, d.out + 0.05);
    if (p < d.in || b >= 1) { d.el.style.opacity = '0'; return; }
    const s = d.s * (0.2 + 0.8 * ease.back(a)) * (1 - ease.in(b));
    const y = 34 * (1 - ease.out(a)) - 10 * ease.inOut(h) - 14 * ease.in(b);
    // one little puzzled rock while it hangs there
    const rock = 5 * Math.sin(2 * Math.PI * win(h, 0.25, 0.75)) * (1 - ease.inOut(win(h, 0.55, 0.75)));
    const r = d.r + (d.r > 0 ? 1 : -1) * 16 * (1 - ease.back(a)) + rock;
    // the last sliver of the snap-out is dropped so no speck hangs in the air
    set(d.el, { y, s, r, o: s > 0.12 * d.s ? 1 : 0 });
  }

  // sweat drop: pops on the temple, hangs, then slides down the side of the head and is gone
  function sweat(p) {
    const a = win(p, 0.50, 0.56), m = win(p, 0.62, 0.84), b = win(p, 0.80, 0.86);
    if (p < 0.50 || b >= 1) { drop.setAttribute('transform', 'translate(122 162) scale(0)'); return; }
    const k = ease.in(m);
    const x = 122 - 12 * k, y = 162 + 96 * k;
    let s = 1.25 * ease.back(a) * (1 - ease.in(b));
    if (b > 0 && s < 0.2) s = 0;
    const stretch = 1 + 0.16 * Math.sin(Math.PI * Math.min(m * 1.2, 1));
    drop.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${(6 * k).toFixed(2)}) scale(${(s / Math.sqrt(stretch)).toFixed(4)} ${(s * stretch).toFixed(4)})`);
  }

  // scratching: two bursts, the marks swap every three frames
  function scratch(p) {
    const on = (p >= 0.08 && p < 0.34) || (p >= 0.58 && p < 0.84);
    const pose = Math.floor(p * 24 + 1e-6) % 2;
    scrA.style.opacity = on && pose === 0 ? '1' : '0';
    scrB.style.opacity = on && pose === 1 ? '1' : '0';
  }

  Sticker({
    seconds: 2.4, fps: 30, poster: 50,
    draw(p) {
      const t = tilt(p);
      set(bust, { r: t.r });
      set(squash, { sx: t.sx, sy: t.sy });
      qs.forEach((d) => q(d, p));
      sweat(p);
      scratch(p);
    },
  });
</script>
</body>
</html>
