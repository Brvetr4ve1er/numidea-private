  <svg class="fx" id="fx" viewBox="0 0 1080 1080">
    <!-- keystroke ticks beside the front paws, ink under bone like the hand-drawn outline -->
    <g id="ticks" fill="none" stroke-linecap="round"></g>
    <!-- the chat bubble the cat is typing into: bone pill, ink outline, tail toward his face -->

      <path d="M -75 -75 L 75 -75 A 75 75 0 0 1 75 75 L -28 75 Q -70 104 -158 122 Q -108 94 -100.6 70.5 A 75 75 0 0 1 -75 -75 Z"

<script src="../runtime.js"></script>
<script>
  const { ease, win, set } = Motion;
  const F = 72;                           // frames per loop (2.4 s at 30 fps); keys below are in frames
  const K = 1.08;                         // asset px to stage px
  const fig = document.getElementById('fig'), screen = document.getElementById('screen');
  const bubble = document.getElementById('bubble');
  const dots = [0, 1, 2].map((i) => document.getElementById('d' + i));
  const BUB = { x: 854, y: 182, r: -4 }; // bubble centre on the stage
  const KEYS = [4, 11, 18];               // the three keystrokes: one dot each

  // keyframes: [[frame, value, easeIntoThisKey], ...], first and last at rest
  function kf(f, keys) {
    for (let i = 1; i < keys.length; i++) {
      if (f <= keys[i][0]) {
        const [t0, v0] = keys[i - 1], [t1, v1, e = ease.inOut] = keys[i];
        return v0 + (v1 - v0) * e((f - t0) / (t1 - t0));
      }
    }
    return keys[keys.length - 1][1];
  }

  // each dot pops in on its keystroke (overshoot), joins one wave hop, then all three
  // get deleted right to left, like a backspace, so the loop restarts on an empty bubble
  function drawDot(el, i, f) {
    const k = KEYS[i];
    const j = 2 - i;                      // backspace order: the last dot typed goes first
    const s = kf(f, [[0, 0], [k, 0], [k + 5, 1, ease.back], [58 + 2 * j, 1], [60 + 2 * j, 1.12, ease.out], [63 + 2 * j, 0, ease.in], [F, 0]]);
    const hop = kf(f, [[0, 0], [30 + 3 * i, 0], [34 + 3 * i, -13, ease.out], [39 + 3 * i, 0, ease.in], [F, 0]]);
    el.setAttribute('cx', String(-70 + 70 * i));
    el.setAttribute('cy', hop.toFixed(2));
    el.setAttribute('r', (23 * s).toFixed(2));
    el.setAttribute('opacity', s > 0.01 ? '1' : '0');
  }

  // little tap marks fan out from the front paws on each keystroke, then retract
  const NS = 'http://www.w3.org/2000/svg';
  const ticksG = document.getElementById('ticks');
  const PAW = { x: 576, y: 862 };         // at the tip of the right front paw, on the keys
  const TICK = [-78, -40, -4];             // stroke angles, degrees (up-right fan)
  const ticks = TICK.map((a) => {
    const g = document.createElementNS(NS, 'g');
    const ink = document.createElementNS(NS, 'line'), bone = document.createElementNS(NS, 'line');
    for (const [el, col, w] of [[ink, '#1b1712', 19], [bone, '#efe6d6', 8]]) {
      el.setAttribute('stroke', col); el.setAttribute('stroke-width', w); g.appendChild(el);
    }
    ticksG.appendChild(g);
    return { a: a * Math.PI / 180, g, ink, bone };
  });
  function drawTicks(f) {
    // the most recent keystroke within 6 frames drives the marks
    let t = -1;
    for (const k of KEYS) if (f >= k && f < k + 6) t = (f - k) / 6;
    if (t < 0) { ticks.forEach((tk) => tk.g.setAttribute('opacity', '0')); return; }
    const head = ease.out(Math.min(t / 0.45, 1)), tail = ease.inOut(win(t, 0.4, 1));
    ticks.forEach((tk) => {
      const r0 = 22 + 40 * tail, r1 = 22 + 40 * head;
      const c = Math.cos(tk.a), s = Math.sin(tk.a);
      for (const el of [tk.ink, tk.bone]) {
        el.setAttribute('x1', (PAW.x + r0 * c).toFixed(1)); el.setAttribute('y1', (PAW.y + r0 * s).toFixed(1));
        el.setAttribute('x2', (PAW.x + r1 * c).toFixed(1)); el.setAttribute('y2', (PAW.y + r1 * s).toFixed(1));
      }
      tk.g.setAttribute('opacity', tail >= 0.98 ? '0' : '1');
    });
  }

  // two soft screen pulses per loop: a quick brighten, a slower fade back to the resting glow
  function screenGlow(p) {
    const t = (2 * p) % 1;
    const v = Math.min(ease.out(win(t, 0.04, 0.14)), 1 - ease.inOut(win(t, 0.14, 0.62)));
    return 0.62 + 0.3 * v;
  }

  Sticker({
    seconds: 2.4, fps: 30, poster: 28,
    draw(p) {
      const f = p * F;
      // one slow breath per loop, swelling up from the ground line
      const b = 0.5 - 0.5 * Math.cos(2 * Math.PI * p);
      set(fig, { s: K, sx: 1 + 0.006 * b, sy: 1 + 0.016 * b });
      screen.style.opacity = screenGlow(p).toFixed(3);
      // the bubble gives a tiny bump on each keystroke
      let bump = 0;
      for (const k of KEYS) bump = Math.max(bump, kf(f, [[0, 0], [k, 0], [k + 2, 1, ease.out], [k + 6, 0, ease.inOut], [F, 0]]));
      bubble.setAttribute('transform', `translate(${BUB.x} ${BUB.y}) rotate(${BUB.r}) scale(${(1 + 0.03 * bump).toFixed(4)})`);
      dots.forEach((el, i) => drawDot(el, i, f));
      drawTicks(f);
    },
  });
</script>
